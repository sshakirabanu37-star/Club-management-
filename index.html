<form id="register-form" novalidate class="form-grid two">
 <div class="field">
 <label for="r-name">Full name</label>
 <input id="r-name" name="name" type="text" autocomplete="name">
 <div class="error" id="err-name"></div>
 </div>
 <div class="field">
 <label for="r-dept">Department</label>
 <select id="r-dept" name="dept">
 <option value="">Select department</option>
 <option>BCA</option>
 <option>BSc Computer Science</option>
 </select>
 <div class="error" id="err-dept"></div>
 </div>
 <button type="submit">Register</button>
</form
